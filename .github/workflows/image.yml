# Builds the demo image, the web app and the API in one (ADR-0010), with the
# sign-in form prefilled for the public demo, and pushes it to
# GitHub Container Registry as ghcr.io/<owner>/outlet-owl, tagged latest and
# with the commit sha. It only publishes an image: deploying it to Azure is
# the operator's step (docs/runbooks/deploy-azure.md). Plain docker commands,
# no third-party actions; the built-in GITHUB_TOKEN is the only credential.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg VERSION="${GITHUB_SHA::7}" --build-arg DEMO_PREFILL=true -t "$image:${GITHUB_SHA::7}" -t "$image:latest" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Push
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          echo "pushed $IMAGE:${GITHUB_SHA::7} and :latest" >> "$GITHUB_STEP_SUMMARY"
