# OutletOwl CI on GitHub Actions (ADR-0004). Every gate is a `make` target, so
# the Makefile stays the single source of what a gate does and the engineer
# can run each job locally. GitHub sets CI=true; a missing tool fails a gate
# instead of passing it.
#
# No model key exists in CI and openrouter.ai resolves to 0.0.0.0 in every
# job, so nothing here can make a live model call (REQ-035, HLD section 12
# phase 0). There are no deploy jobs: the product runs locally (PRD section 6).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  # Pull requests only: the branch name and every new commit subject follow the
  # team's practice (AGENTS.md "Commits"), the same rules as .githooks.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: branch name
        env: { BRANCH: "${{ github.head_ref }}" }
        run: |
          echo "$BRANCH" | grep -Eq '^(feature|bugfix|hotfix|chore|docs|release)/[a-z0-9][a-z0-9-]*$|^release/v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "branch '$BRANCH' does not match <type>/<short-name>"; exit 1; }
          echo "branch-name: 1 branch checked"
      - name: commit messages
        env: { BASE: "${{ github.base_ref }}" }
        run: |
          range="origin/$BASE..HEAD"
          n=0
          for c in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$c" > msg.txt
            bash .githooks/commit-msg msg.txt
            n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo "commits: 0 commits in $range"; exit 1; }
          echo "commits: $n commit messages checked"

  # The offline gate: Go fmt, vet, golangci-lint and tests; web format, lint,
  # typecheck and tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: block the model provider
        run: echo "0.0.0.0 openrouter.ai" | sudo tee -a /etc/hosts
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc }
      - name: tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - name: web dependencies
        run: corepack enable && cd web && pnpm install --frozen-lockfile
      - run: make check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc }
      - name: web dependencies
        run: corepack enable && cd web && pnpm install --frozen-lockfile
      - run: make build

  # Needs PostgreSQL, so it is a job here and not part of make check.
  integration:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: outlet_owl, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outlet_owl?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: block the model provider
        run: echo "0.0.0.0 openrouter.ai" | sudo tee -a /etc/hosts
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test-integration

  # Needs the network (the Go vulnerability database and the npm registry).
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc }
      - name: tools
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: web dependencies
        run: corepack enable && cd web && pnpm install --frozen-lockfile
      - run: make vuln
