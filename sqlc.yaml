# sqlc compiles db/queries against db/migrations into typed Go in
# internal/store (ADR-0003); make sqlc regenerates it.
version: "2"
sql:
  - engine: postgresql
    schema: [db/migrations, db/migrations/budget]
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: true
        # Nullable columns become Go pointers (*int64, *string), and every
        # timestamptz a time.Time, so callers never handle pgtype wrappers.
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
